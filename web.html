<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini SQLite Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18243b;font:16px system-ui,sans-serif}header{background:#18243b;color:white;padding:25px 32px}h1{margin:0;font-size:25px}header p{color:#bac9df;margin-bottom:0}main{display:grid;grid-template-columns:260px 1fr;gap:24px;max-width:1250px;margin:30px auto;padding:0 24px}section,aside{background:white;border:1px solid #dce2ed;border-radius:12px;padding:22px}h2{font-size:18px;margin-top:0}textarea{width:100%;min-height:190px;padding:15px;font:15px monospace;border:1px solid #bcc7d9;border-radius:8px;resize:vertical}button{background:#305fdd;border:0;border-radius:6px;padding:10px 16px;color:white;cursor:pointer;margin:10px 6px 10px 0}button:disabled{opacity:.5}aside button{display:block;width:100%;text-align:left;background:#eef2fb;color:#18243b}.muted{color:#63728b;font-size:14px}#status{white-space:pre-wrap;margin:14px 0}.error{color:#ab2525}.results{overflow:auto;max-height:450px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #dce2ed;padding:10px;white-space:pre-wrap}th{background:#eef2fb}@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
<header><h1>Mini SQLite Studio</h1><p>A Python database, from query to disk.</p></header>
<main><aside><h2>Tables</h2><button id="refresh">Refresh schema</button><div id="tables"></div><p class="muted">Select a table to browse its rows.</p></aside>
<section><h2>SQL editor</h2><textarea id="sql" aria-label="SQL statement" spellcheck="false">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);</textarea><button id="run">Run statement</button><span class="muted">Ctrl / ⌘ + Enter</span><p class="muted">One statement at a time. Supports CREATE, INSERT, SELECT, UPDATE, DELETE and DROP.</p><div id="status" role="status" aria-live="polite">Ready.</div><div class="results" id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);
async function request(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data;}
function schema(tables){$('tables').replaceChildren();for(const [name,table] of Object.entries(tables)){const button=document.createElement('button');button.textContent=`${name} · ${table.row_count} rows`;button.onclick=()=>{$('sql').value=`SELECT * FROM ${name};`;run();};const details=document.createElement('p');details.className='muted';details.textContent=table.columns.map(c=>`${c.name}: ${c.type}${c.primary?' (PK)':''}`).join('\n');$('tables').append(button,details);}if(!Object.keys(tables).length)$('tables').textContent='No tables yet.';}
function show(result){$('results').replaceChildren();if(!Array.isArray(result)){$('status').textContent=result;return;}$('status').textContent=`${result.length} rows returned`;if(!result.length)return;const table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr'),columns=Object.keys(result[0]);for(const column of columns){const th=document.createElement('th');th.textContent=column;tr.append(th);}head.append(tr);table.append(head);const body=document.createElement('tbody');for(const row of result){const tr=document.createElement('tr');for(const col of columns){const td=document.createElement('td');td.textContent=row[col]===null?'NULL':String(row[col]);tr.append(td);}body.append(tr);}table.append(body);$('results').append(table);}
async function run(){$('run').disabled=true;$('status').className='';$('status').textContent='Running…';try{const data=await request('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:$('sql').value})});schema(data.schema);show(data.result);}catch(error){$('status').className='error';$('status').textContent=error.message;$('results').replaceChildren();}finally{$('run').disabled=false;}}
$('run').onclick=run;$('refresh').onclick=async()=>{try{schema((await request('/api/schema')).schema);}catch(error){$('status').textContent=error.message;}};$('sql').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();if(!$('run').disabled)run();}};$('refresh').click();
</script>
</html>
